start_dialog:
  fields:
    echo_device:
      example: media_player.wohnzimmer_echo_dot
      selector:
        entity:
          domain: media_player

ask_question:
  fields:
    question:
      example: "Wie weit ist der Mond entfernt?"
      required: true
      selector:
        text:
    echo_device:
      example: media_player.wohnzimmer_echo_dot
      selector:
        entity:
          domain: media_player

interactive_question:
  fields:
    question:
      example: "Die Waschmaschine ist fertig. Soll ich die Steckdose ausschalten?"
      required: true
      selector:
        text:
    echo_device:
      example: media_player.wohnzimmer_echo_dot
      selector:
        entity:
          domain: media_player
    event_id:
      example: "waschmaschine_fertig"
      selector:
        text:
