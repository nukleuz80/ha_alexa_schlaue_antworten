<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Main Speech Wave Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="246" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Main Stylized Speech Dialog Silhouette -->
  <g filter="url(#softGlow)">
    <!-- Outer Arc / Speech Bubble Loop -->
    <path d="M 256 96 C 160 96 86 164 86 250 C 86 295 108 335 144 363 C 140 388 128 408 112 424 C 140 422 178 409 204 391 C 220 398 238 402 256 402 C 352 402 426 334 426 248 C 426 162 352 96 256 96 Z"
          fill="none"
          stroke="url(#primaryGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>

  <!-- Central Dynamic Soundwave / Voice AI Waves -->
  <!-- Wave Bar 1 (Outer Left) -->
  <line x1="180" y1="220" x2="180" y2="280" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  <circle cx="180" cy="216" r="7" fill="#38bdf8"/>
  <circle cx="180" cy="284" r="7" fill="#38bdf8"/>

  <!-- Wave Bar 2 (Mid Left) -->
  <line x1="218" y1="184" x2="218" y2="316" stroke="url(#primaryGrad)" stroke-width="15" stroke-linecap="round"/>
  <circle cx="218" cy="180" r="7.5" fill="#6366f1"/>
  <circle cx="218" cy="320" r="7.5" fill="#6366f1"/>

  <!-- Wave Bar 3 (Center - Highest / Core AI Spark) -->
  <line x1="256" y1="156" x2="256" y2="344" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="152" r="8" fill="#a855f7"/>
  <circle cx="256" cy="348" r="8" fill="#a855f7"/>

  <!-- Wave Bar 4 (Mid Right) -->
  <line x1="294" y1="190" x2="294" y2="310" stroke="url(#primaryGrad)" stroke-width="15" stroke-linecap="round"/>
  <circle cx="294" cy="186" r="7.5" fill="#6366f1"/>
  <circle cx="294" cy="314" r="7.5" fill="#6366f1"/>

  <!-- Wave Bar 5 (Outer Right) -->
  <line x1="332" y1="226" x2="332" y2="274" stroke="#818cf8" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <circle cx="332" cy="222" r="7" fill="#818cf8"/>
  <circle cx="332" cy="278" r="7" fill="#818cf8"/>

  <!-- Neural Constellation Sparkle Connectors -->
  <path d="M 180 216 L 218 180 L 256 152 L 294 186 L 332 222" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Golden Smart Sparks ("Schlaue Antworten" Intelligence Elements) -->
  <!-- Upper Right AI Spark -->
  <g transform="translate(366, 134)" filter="url(#sparkleGlow)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="url(#accentGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Small Ambient Spark Upper Left -->
  <g transform="translate(142, 168)" filter="url(#sparkleGlow)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Micro Spark Bottom Right -->
  <g transform="translate(362, 340)" filter="url(#sparkleGlow)">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#fbbf24" opacity="0.85"/>
  </g>
</svg>

